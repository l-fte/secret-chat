* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'MyLang', Tahoma, sans-serif !important;
}
:root{
  --bg:#0f0a1e;--sidebar:#1a1033;--header:#1a1033;
  --bubble-me:#6b3fa0;--bubble-them:#2a1f4a;
  --purple:#8b5cf6;--purple-l:#a78bfa;--purple-d:#5b21b6;
  --text:#e2d9f3;--dim:#9d8ec4;--border:#2d1f5e;--green:#22c55e;
}
body{background:var(--bg);color:var(--text);height:100vh;display:flex;overflow:hidden}

/* SIDEBAR */
.sidebar{width:300px;background:var(--sidebar);border-left:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0}
.s-head{padding:16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px}
.logo{width:38px;height:38px;background:linear-gradient(135deg,var(--purple),var(--purple-d));border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:20px}
.app-title{font-size:17px;font-weight:700;color:var(--purple-l)}
.app-sub{font-size:11px;color:var(--dim)}
.s-search{margin:10px;background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:8px 12px;color:var(--text);font-size:14px;outline:none;width:calc(100% - 20px);}
.s-search:focus{border-color:var(--purple)}
.s-label{padding:4px 16px 6px;font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:1px}
.contact{display:flex;align-items:center;gap:12px;padding:12px 16px;cursor:pointer;transition:background .15s;border-right:3px solid transparent}
.contact:hover,.contact.active{background:rgba(139,92,246,.15)}
.contact.active{border-right-color:var(--purple)}
.avatar{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--purple-d),var(--purple));display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;position:relative}
.online::after{content:'';position:absolute;bottom:2px;left:2px;width:10px;height:10px;background:var(--green);border-radius:50%;border:2px solid var(--sidebar)}
.c-info{flex:1;min-width:0}
.c-name{font-size:15px;font-weight:600}
.c-prev{font-size:12px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.c-time{font-size:11px;color:var(--dim)}

/* CHAT */
.chat{flex:1;display:flex;flex-direction:column;background:var(--bg);position:relative;}
.c-head{padding:12px 20px;background:var(--header);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;z-index:10;}
.c-head-info{flex:1}
.c-head-name{font-size:16px;font-weight:700}
.c-head-status{font-size:12px;color:var(--green)}
.h-btn{background:none;border:none;color:var(--dim);cursor:pointer;font-size:18px;padding:6px;border-radius:6px;transition:color .15s,background .15s}
.h-btn:hover{color:var(--purple-l);background:rgba(139,92,246,.15)}

/* MESSAGES */
.msgs{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:4px;background:radial-gradient(ellipse at 20% 50%,rgba(91,33,182,.06) 0%,transparent 60%),radial-gradient(ellipse at 80% 20%,rgba(139,92,246,.05) 0%,transparent 50%),var(--bg)}
.msgs::-webkit-scrollbar{width:4px}
.msgs::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.msg-group{display:flex;flex-direction:column;margin-bottom:6px}
.bubble{max-width:65%;padding:10px 14px;border-radius:18px;font-size:22px;line-height:1.5;word-break:break-word;animation:popIn .2s ease}
@keyframes popIn{from{opacity:0;transform:scale(.95) translateY(4px)}to{opacity:1;transform:scale(1) translateY(0)}}
.bubble.me{background:var(--bubble-me);align-self:flex-start;border-bottom-right-radius:4px;color:#fff}
.bubble.them{background:var(--bubble-them);align-self:flex-end;border-bottom-left-radius:4px;border:1px solid var(--border)}
.msg-meta{font-size:11px;color:var(--dim);margin-top:3px;display:flex;align-items:center;gap:4px}
.msg-meta.me{justify-content:flex-start;padding-right:4px}
.msg-meta.them{justify-content:flex-end;padding-left:4px}
.check{color:var(--purple-l)}
.divider{text-align:center;color:var(--dim);font-size:12px;margin:14px 0;position:relative}
.divider::before,.divider::after{content:'';position:absolute;top:50%;height:1px;background:var(--border);width:calc(50% - 55px)}
.divider::before{right:0}.divider::after{left:0}
.msg-img{max-width:220px;border-radius:12px;cursor:pointer;display:block;margin-bottom:4px}
.sender-name{font-size:11px;color:var(--purple-l);margin-bottom:3px}

/* REPLY BUTTON IN MESSAGE */
.reply-btn { background: none; border: none; color: var(--dim); cursor: pointer; font-size: 14px; opacity: 0.6; transition: opacity 0.2s, color 0.2s; padding: 0 4px; }
.reply-btn:hover { opacity: 1; color: var(--purple-l); }

/* REPLY BUBBLE INSIDE MESSAGE */
.msg-reply { background: rgba(0,0,0,0.15); border-right: 3px solid var(--purple-l); padding: 6px 10px; border-radius: 6px; margin-bottom: 6px; font-size: 18px; cursor: pointer; }
.msg-reply-sender { color: var(--purple-l); font-weight: bold; margin-bottom: 2px; }
.msg-reply-text { color: rgba(255,255,255,0.8); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px; }
.them .msg-reply { border-right-color: var(--dim); background: rgba(255,255,255,0.05); }
.them .msg-reply-sender { color: var(--dim); }

/* REPLY PREVIEW BAR (ABOVE INPUT) */
.reply-preview { display: none; padding: 10px 16px; background: var(--header); border-top: 1px solid var(--border); align-items: center; justify-content: space-between; gap: 10px; font-size: 18px; border-right: 3px solid var(--purple-l); }
.reply-preview.active { display: flex; animation: slideUp 0.2s ease; }
@keyframes slideUp { from{ transform: translateY(10px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
.rp-content { flex: 1; overflow: hidden; }
.rp-sender { color: var(--purple-l); font-weight: bold; margin-bottom: 2px; }
.rp-text { color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rp-close { background: none; border: none; color: var(--dim); cursor: pointer; font-size: 16px; padding: 4px; border-radius: 50%; transition: 0.2s; }
.rp-close:hover { color: #ff4757; background: rgba(255,71,87,0.1); }

/* INPUT */
.input-area{padding:12px 16px;background:var(--header);border-top:1px solid var(--border);display:flex;align-items:flex-end;gap:10px;z-index:10;}
.i-btn{background:none;border:none;color:var(--dim);cursor:pointer;font-size:20px;padding:8px;border-radius:50%;transition:color .15s,background .15s;flex-shrink:0}
.i-btn:hover{color:var(--purple-l);background:rgba(139,92,246,.15)}
.msg-input{flex:1;background:var(--bg);border:1px solid var(--border);border-radius:22px;padding:10px 16px;color:var(--text);font-size:20px;outline:none;resize:none;max-height:120px;min-height:44px;line-height:1.4;transition:border-color .15s}
.msg-input::placeholder{color:var(--dim)}
.msg-input:focus{border-color:var(--purple)}
.send{width:44px;height:44px;background:var(--purple);border:none;border-radius:50%;color:#fff;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .15s,transform .1s}
.send:hover{background:var(--purple-d)}
.send:active{transform:scale(.92)}

/* MODAL */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;z-index:100;backdrop-filter:blur(5px)}
.modal{background:var(--sidebar);border:1px solid var(--border);border-radius:18px;padding:32px;width:340px;display:flex;flex-direction:column;gap:14px;animation:popIn .25s ease}
.modal h2{font-size:21px;color:var(--purple-l);text-align:center}
.modal p{font-size:14px;color:var(--dim);text-align:center;line-height:1.6}
.modal input,.modal select{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:12px 16px;color:var(--text);font-size:20px;outline:none;transition:border-color .15s;width:100%}
.modal input:focus,.modal select:focus{border-color:var(--purple)}
.modal-btn{background:var(--purple);border:none;border-radius:10px;padding:12px;color:#fff;font-size:20px;font-weight:700;cursor:pointer;transition:background .15s;width:100%}
.modal-btn:hover{background:var(--purple-d)}

/* STATUS TOAST */
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:var(--sidebar);border:1px solid var(--border);border-radius:10px;padding:10px 20px;font-size:13px;color:var(--purple-l);z-index:200;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}

@media(max-width:600px){.sidebar{display:none}}
</style>
</head>
<body>

<div class="toast" id="toast"></div>

<div class="overlay" id="modal">
  <div class="modal">
    <div style="font-size:44px;text-align:center">🔐</div>
    <h2>مرحباً بك</h2>
    <p>تطبيق تواصل بلغة سرية خاصة<br>اختر اسمك والغرفة للبدء</p>
    <input id="nameInput" placeholder="اسمك..." maxlength="20" />
    <select id="roomSel">
      <option value="room1">🔒 الغرفة الخاصة ١</option>
      <option value="room2">🔒 الغرفة الخاصة ٢</option>
    </select>
    <button class="modal-btn" id="enterBtn">دخول ←</button>
  </div>
</div>

<div class="sidebar">
  <div class="s-head">
    <div class="logo">🌙</div>
    <div>
      <div class="app-title">لغة سرية</div>
      <div class="app-sub" id="myName">...</div>
    </div>
  </div>
  <input class="s-search" placeholder="بحث..." />
  <div class="s-label">المحادثات</div>
  <div class="contact active">
    <div class="avatar online">🌟</div>
    <div class="c-info">
      <div class="c-name" id="roomLabel">الغرفة الخاصة</div>
      <div class="c-prev" id="prevMsg">لا توجد رسائل بعد</div>
    </div>
    <div class="c-time" id="prevTime"></div>
  </div>
</div>

<div class="chat">
  <div class="c-head">
    <div class="avatar online">🌟</div>
    <div class="c-head-info">
      <div class="c-head-name" id="chatTitle">الغرفة الخاصة</div>
      <div class="c-head-status" id="chatStatus">متصل</div>
    </div>
    <div style="display:flex;gap:8px">
      <button class="h-btn" onclick="clearChat()" title="مسح المحادثة">🗑️</button>
      <button class="h-btn" onclick="logout()" title="تسجيل الخروج">🚪</button>
    </div>
  </div>

  <div class="msgs" id="msgs">
    <div class="divider">اليوم</div>
    <div style="text-align:center;color:var(--dim);font-size:13px;margin:50px auto;max-width:240px;line-height:1.9">
      🔐 محادثة خاصة<br>الرسائل مرئية لأصحاب الغرفة فقط
    </div>
  </div>

  <div class="reply-preview" id="replyPreview">
    <div class="rp-content">
      <div class="rp-sender" id="rpSender">اسم المرسل</div>
      <div class="rp-text" id="rpText">نص الرسالة...</div>
    </div>
    <button class="rp-close" onclick="cancelReply()" title="إلغاء الرد">✖</button>
  </div>

  <div class="input-area">
    <label class="i-btn" title="إرسال صورة">
      📎<input type="file" accept="image/*" id="imgFile" style="display:none" onchange="sendImg(event)"/>
    </label>
    <textarea class="msg-input" id="msgIn" placeholder="اكتب رسالتك..." rows="1"
      onkeydown="onKey(event)" oninput="resize(this)"></textarea>
    <button class="send" onclick="sendMsg()">➤</button>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://djdbuwaollafkfdwobmd.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRqZGJ1d2FvbGxhZmtmZHdvYm1kIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg0ODU2NDUsImV4cCI6MjA5NDA2MTY0NX0.EFxzrFBg4iLrUWqVJOV43fdSOV1h8FFJ9JDlzrsgs00';

const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_KEY);

let myName = '', currentRoom = 'room1', sub = null;
let replyingTo = null;

// فحص وجود تسجيل دخول مسبق عند فتح الصفحة
window.onload = () => {
  const savedName = localStorage.getItem('chatUser');
  const savedRoom = localStorage.getItem('chatRoom');
  
  if (savedName && savedRoom) {
    document.getElementById('nameInput').value = savedName;
    document.getElementById('roomSel').value = savedRoom;
    startChat(); // الدخول تلقائياً
  }
};

document.getElementById('enterBtn').onclick = startChat;
document.getElementById('nameInput').addEventListener('keydown', e => { if(e.key==='Enter') startChat(); });

async function startChat() {
  const name = document.getElementById('nameInput').value.trim();
  if (!name) { document.getElementById('nameInput').focus(); return; }
  
  myName = name;
  currentRoom = document.getElementById('roomSel').value;
  
  // حفظ البيانات بالمتصفح حتى ما تنمسح بالتحديث
  localStorage.setItem('chatUser', myName);
  localStorage.setItem('chatRoom', currentRoom);

  document.getElementById('modal').style.display = 'none';
  document.getElementById('myName').textContent = name;
  
  const roomNames = { room1: 'الغرفة الخاصة ١', room2: 'الغرفة الخاصة ٢' };
  const rn = roomNames[currentRoom];
  document.getElementById('chatTitle').textContent = rn;
  document.getElementById('roomLabel').textContent = rn;
  
  await loadMsgs();
  subscribeRealtime();
  document.getElementById('msgIn').focus();
  showToast('✓ متصل بـ ' + rn);
}

// دالة تسجيل الخروج
function logout() {
  localStorage.removeItem('chatUser');
  localStorage.removeItem('chatRoom');
  location.reload(); // إعادة تحميل الصفحة لإظهار واجهة الدخول
}

function onKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMsg(); }
}

function resize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

function getTime(ts) {
  return new Date(ts || Date.now()).toLocaleTimeString('ar', { hour:'2-digit', minute:'2-digit' });
}

function setReply(sender, text) {
  replyingTo = { sender, text };
  document.getElementById('rpSender').textContent = sender;
  document.getElementById('rpText').textContent = text;
  document.getElementById('replyPreview').classList.add('active');
  document.getElementById('msgIn').focus();
}

function cancelReply() {
  replyingTo = null;
  document.getElementById('replyPreview').classList.remove('active');
}

async function sendMsg() {
  const text = document.getElementById('msgIn').value.trim();
  if (!text || !myName) return;
  document.getElementById('msgIn').value = '';
  document.getElementById('msgIn').style.height = 'auto';
  
  const { error } = await db.from('messages').insert({
    sender: myName,
    text: text,
    room: currentRoom,
    is_custom_font: true, // دائماً ट्रू لأن الموقع كله صار سري
    msg_type: 'text',
    image_data: null,
    reply_sender: replyingTo ? replyingTo.sender : null,
    reply_text: replyingTo ? replyingTo.text : null
  });
  
  if (error) { showToast('❌ خطأ: ' + error.message); console.error(error); }
  else { cancelReply(); }
}

async function sendImg(event) {
  const file = event.target.files[0];
  if (!file || !myName) return;
  showToast('⏳ جاري رفع الصورة...');
  const reader = new FileReader();
  reader.onload = async (e) => {
    const { error } = await db.from('messages').insert({
      sender: myName,
      text: '',
      room: currentRoom,
      is_custom_font: false,
      msg_type: 'image',
      image_data: e.target.result,
      reply_sender: replyingTo ? replyingTo.sender : null,
      reply_text: replyingTo ? replyingTo.text : null
    });
    if (error) showToast('❌ فشل رفع الصورة');
    else { showToast('✓ تم إرسال الصورة'); cancelReply(); }
  };
  reader.readAsDataURL(file);
  event.target.value = '';
}

async function loadMsgs() {
  const { data, error } = await db
    .from('messages')
    .select('*')
    .eq('room', currentRoom)
    .order('created_at', { ascending: true })
    .limit(200);
  if (error) { showToast('❌ فشل تحميل الرسائل'); return; }
  renderAll(data || []);
}

function subscribeRealtime() {
  if (sub) db.removeChannel(sub);
  sub = db.channel('room:' + currentRoom)
    .on('postgres_changes', {
      event: 'INSERT',
      schema: 'public',
      table: 'messages',
      filter: 'room=eq.' + currentRoom
    }, payload => {
      appendMsg(payload.new);
    })
    .subscribe(status => {
      if (status === 'SUBSCRIBED') {
        document.getElementById('chatStatus').textContent = '● متصل';
        document.getElementById('chatStatus').style.color = 'var(--green)';
      }
    });
}

function renderAll(msgs) {
  const c = document.getElementById('msgs');
  if (!msgs.length) {
    c.innerHTML = '<div class="divider">اليوم</div><div style="text-align:center;color:var(--dim);font-size:13px;margin:50px auto;max-width:240px;line-height:1.9">🔐 محادثة خاصة<br>الرسائل مرئية لأصحاب الغرفة فقط</div>';
    return;
  }
  c.innerHTML = '<div class="divider">اليوم</div>';
  msgs.forEach(m => appendMsg(m, false));
  c.scrollTop = c.scrollHeight;
  updatePreview(msgs[msgs.length - 1]);
}

function appendMsg(m, scroll = true) {
  const c = document.getElementById('msgs');
  const isMe = m.sender === myName;
  const side = isMe ? 'me' : 'them';
  const div = document.createElement('div');
  div.className = 'msg-group';

  let replyHTML = '';
  if (m.reply_sender && m.reply_text) {
    replyHTML = `
      <div class="msg-reply" onclick="showToast('هذه رسالة مقتبسة')">
        <div class="msg-reply-sender">${esc(m.reply_sender)}</div>
        <div class="msg-reply-text">${esc(m.reply_text)}</div>
      </div>
    `;
  }

  let contentHTML = '';
  if (m.msg_type === 'image') {
    contentHTML = `${replyHTML}<img src="${m.image_data}" class="msg-image" />`;
  } else {
    contentHTML = `${replyHTML}${esc(m.text).replace(/\n/g,'<br>')}`;
  }

  const replyTextArg = m.msg_type === 'image' ? '📷 صورة' : m.text;
  const escapedSender = esc(m.sender).replace(/'/g, "\\'");
  const escapedTextArg = esc(replyTextArg).replace(/'/g, "\\'").replace(/\n/g, " ");
  
  const replyBtnHTML = `<button class="reply-btn" onclick="setReply('${escapedSender}', '${escapedTextArg}')" title="رد">↩️</button>`;

  div.innerHTML = `
    <div class="bubble ${side}">
      ${!isMe ? '<div class="sender-name">'+esc(m.sender)+'</div>' : ''}
      ${contentHTML}
    </div>
    <div class="msg-meta ${side}">
      ${!isMe ? replyBtnHTML : ''}
      <span>${getTime(m.created_at)}</span>
      ${isMe ? replyBtnHTML + '<span class="check">✓✓</span>' : ''}
    </div>
  `;
  
  c.appendChild(div);
  if (scroll) c.scrollTop = c.scrollHeight;
  updatePreview(m);
}

function updatePreview(m) {
  document.getElementById('prevMsg').textContent = m.msg_type === 'image' ? '📷 صورة' : m.text.substring(0, 35);
  document.getElementById('prevTime').textContent = getTime(m.created_at);
}

async function clearChat() {
  if (!confirm('مسح كل رسائل هذه الغرفة؟')) return;
  await db.from('messages').delete().eq('room', currentRoom);
  renderAll([]);
  showToast('✓ تم مسح المحادثة');
}

function esc(t) {
  return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}
</script>
</body>
</html>
